<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../CSS/style.css">
    <title>Character Customization!</title>
</head>
<body>
    <section class="page-container">
        <h1>Who Are You?</h1>
        <form action="" method="post">

            <label for="name">Name: </label>
            <input type="text" name="name" id="name">

            <br>
            
            <fieldset name="pronouns">
                <legend>Pronouns</legend>
                <input type="radio" name="pronouns" id="they">
                <label for="they">they/them</label>
                <input type="radio" name="pronouns" id="she">
                <label for="she">she/her</label>
                <input type="radio" name="pronouns" id="he">
                <label for="he">he/him</label>
            </fieldset>

            <br>

            <fieldset name="height">
                <legend>Height</legend>
                <input type="radio" name="height" id="short">
                <label for="short">Shorter than 5'5/165cm</label>
                <input type="radio" name="height" id="medium">
                <label for="medium">Between 5'5/165cm and 5'11/180cm</label>
                <input type="radio" name="height" id="tall">
                <label for="tall">Taller than 5'11/180cm</label>
            </fieldset>


        </form>
    </section>
</body>
</html>
